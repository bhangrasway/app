name: Update YouTube feed

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest videos
        run: node .github/scripts/fetch-youtube.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/youtube.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json
          git commit -m "chore: refresh YouTube feed data"
          git push
